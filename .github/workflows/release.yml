name: Release

on:
  push:
    branches:
      - main
      - "v*" # Matches v1, v2, v1.1, etc for patch releases
      - next # Matches beta/rc branches
    paths-ignore:
      - 'docs/**'
      - 'docs-old/**'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync NPM Tags (Main Branch)
        if: steps.changesets.outputs.published == 'true' && github.ref_name == 'main'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          # Loop through all packages and conditionally tag them
          PACKAGES=$(pnpm ls -r --depth -1 --json | jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"')
          for PKG in $PACKAGES; do
            VERSION="${PKG##*@}"
            if [[ "$VERSION" == *-* ]]; then
              # It is a prerelease (e.g. 2.0.0-next.1) -> extract 'next'
              PRERELEASE_PART="${VERSION#*-}"
              TAG="${PRERELEASE_PART%%.*}"
              echo "Ensuring $PKG has $TAG tag..."
              npm dist-tag add "$PKG" "$TAG" || echo "Tag sync skipped for $PKG"
            else
              echo "Ensuring $PKG has latest tag..."
              npm dist-tag add "$PKG" latest || echo "Tag sync skipped for $PKG"
            fi
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
