name: CI

on:
  push:
    branches:
      - "!main"
      - "!next"
      - "!v*"
      - "**" # This tells CI to run on all other feature branches
    paths-ignore:
      - 'docs/**'
      - 'docs-old/**'
  pull_request:
    branches:
      - main
      - "v*"
      - next
    paths-ignore:
      - 'docs/**'
      - 'docs-old/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build

      - name: Run Type Checks
        run: pnpm run check-types

      - name: Run Tests
        run: pnpm test

      - name: Verify changesets are present
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          npx changeset status --since=origin/${{ github.base_ref }}
