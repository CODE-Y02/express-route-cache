name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-old/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build with Next.js (Fumadocs)
        run: pnpm run docs:build

      - name: Build old docs (Vitepress)
        run: pnpm --filter docs-old build

      - name: Copy old docs to static export
        run: |
          mkdir -p docs/out/old-docs
          cp -r docs-old/.vitepress/dist/* docs/out/old-docs/
      
      - name: Create .nojekyll
        run: touch docs/out/.nojekyll

      - name: Debug Output
        run: |
          echo "Listing build output directory:"
          ls -R docs/out
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
